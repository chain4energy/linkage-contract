[package]
name = "linkage-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std = { version = "=2.2.2", features = ["staking"], optional = false }
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
cw-storage-plus = "2.0.0"
cosmwasm-schema = "2.2.2"
schemars = "0.8.21"
sylvia = "1.3.5"
thiserror = "2.0.12"
did-contract = { git = "https://github.com/chain4energy/did-contract.git", tag = "v0.0.1-beta002" }
# did-contract = { path = "../did", features = ["library"] }


[dev-dependencies]
cw-multi-test = { version = "2.3.3", features = ["staking"] }
sylvia = { version = "1.3.5", features = ["mt"] }
serde_json = "1.0.128"
serial_test = "3.1"
cosmrs = { version = "0.22", features = ["cosmwasm"] }
e2e-test-suite = { git = "http://gitlab.sce-ovoo.pl/c4e/chain/test/e2e-contract-test/e2e-test-suite.git", tag = "v0.0.1-beta003" }
# e2e-test-suite = { path = "../../e2e-test/e2e-test-suite" }
cw721-base = "0.18.0"
cw721 = "0.18.0"
regex = "1.11.1"
